<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15181C">
<title>MINDMAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   마인드맵 — 생각을 흩뿌리고, 무게중심을 발견하는 도구
   chrome(작업대)는 조용한 흑연색, 성격은 A4 시트의 테마가 가져간다.
   UI 강조색(--accent)은 현재 테마의 노드 색을 그대로 물려받는다.
   ============================================================ */
:root{
  --bg:#15181C;        /* 작업대 */
  --panel:#1E232A;     /* 패널 */
  --panel2:#252B33;
  --line:#333B45;      /* 헤어라인 */
  --txt:#E7EAEE;
  --dim:#8A94A2;
  --accent:#4CAF7D;    /* 테마에 따라 동적으로 교체 */
  --accentTxt:#0F1216;
  --radius:14px;
  --sheetShadow:0 24px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.05);
  --font:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --sheetFont:"Gowun Dodum",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--txt);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;
  letter-spacing:-.01em;
  /* 크롬의 '탭하여 검색', 롱프레스 메뉴, 드래그 선택을 모두 막는다 */
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none !important}

/* ---------- 공통 요소 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:46px;padding:0 18px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);font-size:15px;font-weight:600;transition:.15s;
}
.btn:hover{background:#2E353E}
.btn.primary{background:var(--accent);color:var(--accentTxt);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:10px}
.iconbtn{
  width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;transition:.15s;font-size:17px;color:var(--dim)
}
.iconbtn:hover{background:var(--panel2);color:var(--txt)}
.field{
  width:100%;height:48px;border-radius:12px;background:#12161A;border:1px solid var(--line);
  color:var(--txt);padding:0 14px;font-size:15.5px;
}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{height:auto;min-height:96px;padding:12px 14px;line-height:1.5;resize:none}
label.lbl{display:block;font-size:12.5px;color:var(--dim);margin:0 0 7px 2px;font-weight:600;letter-spacing:.02em}

/* ---------- 로그인 ---------- */
#authView{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;gap:0;
  background:
    radial-gradient(1000px 620px at 50% 8%, #1F262E 0%, #15181C 62%, #101317 100%);
}
.brandmark{width:86px;height:86px;margin-bottom:22px}
.brandtitle{font-size:31px;font-weight:800;letter-spacing:.16em;margin:0}
.brandsub{color:var(--dim);font-size:13.5px;margin:10px 0 30px;letter-spacing:.02em}
.authbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.authswitch{margin-top:14px;text-align:center;font-size:13px;color:var(--dim)}
.authswitch b{color:var(--accent);cursor:pointer}
.divider{display:flex;align-items:center;gap:12px;color:#59626E;font-size:11.5px;margin:6px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{font-size:13px;min-height:18px;text-align:center;color:#E2896F}

/* ---------- 시작 화면 ---------- */
#startView{position:fixed;inset:0;display:flex;flex-direction:column;padding:26px;gap:14px;overflow:auto}
.startTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.startTop h2{font-size:20px;margin:0;letter-spacing:.02em}
.card{
  border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);
  padding:18px;display:flex;align-items:center;gap:14px;transition:.15s;text-align:left;width:100%
}
.card:hover{border-color:var(--accent);background:var(--panel2)}
.card .big{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;font-size:12.5px;color:var(--dim)}
.sectionTitle{font-size:12.5px;color:var(--dim);font-weight:700;letter-spacing:.06em;margin:18px 2px 4px}

/* ---------- 에디터 ---------- */
#appView{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;
  background:rgba(21,24,28,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:5
}
.docTitle{
  flex:1;min-width:0;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:6px 8px;border-radius:9px
}
.docTitle:hover{background:var(--panel2)}
.saveDot{font-size:11px;color:var(--dim);flex:0 0 auto;margin-right:2px;white-space:nowrap}

#stage{flex:1;position:relative;overflow:hidden;background:#131619}
#viewport{position:absolute;inset:0;touch-action:none}
#sheetWrap{position:absolute;inset:0}
#sheet{display:block;width:100%;height:100%;font-family:var(--sheetFont)}

/* 무게중심 표시 */
.hubbar{
  position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;
  pointer-events:none;flex-wrap:wrap;max-width:60%
}
.hubchip{
  font-size:11.5px;padding:5px 10px;border-radius:999px;background:transparent;
  border:1px solid var(--sheetLine,#888);color:var(--sheetInk,#888);letter-spacing:.02em;opacity:.75
}
.hubchip b{color:var(--accent);font-weight:700}

/* 확대/축소 */
.zoomer{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:7}
.zbtn{width:40px;height:40px;border-radius:12px;background:rgba(30,35,42,.92);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--dim)}
.zbtn:hover{color:var(--txt)}
.fab{
  width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accentTxt);
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:300;
  box-shadow:0 10px 28px rgba(0,0,0,.45);transition:.15s;margin-top:4px
}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:scale(.94)}

/* 라벨 달린 도구 버튼 */
.toolbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:46px;min-width:54px;padding:0 6px;border-radius:11px;color:var(--dim);
  font-size:10px;font-weight:600;letter-spacing:-.02em;transition:.15s
}
.toolbtn:hover{background:var(--panel2);color:var(--txt)}
.toolbtn i{display:block;width:19px;height:19px}
.toolbtn svg,.abtn svg,.drawerTab svg{width:100%;height:100%;display:block}

/* 우측면 서랍 손잡이 */
.drawerTab{
  position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:15;
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:17px 8px;
  background:var(--panel);border:1px solid var(--line);border-right:0;border-radius:13px 0 0 13px;
  color:var(--dim);box-shadow:-8px 0 20px rgba(0,0,0,.32);transition:.15s
}
.drawerTab:hover{color:var(--txt);background:var(--panel2)}
.drawerTab i{display:block;width:17px;height:17px}
.drawerTab span{writing-mode:vertical-rl;font-size:11.5px;font-weight:700;letter-spacing:.16em}
#edgeSwipe{position:absolute;right:0;top:0;bottom:0;width:14px;z-index:14;touch-action:none}

/* 첫 사용 안내 */
.tapTip{
  position:absolute;left:12px;top:12px;z-index:6;font-size:11px;padding:6px 11px;
  border-radius:999px;pointer-events:none;background:rgba(30,35,42,.82);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;letter-spacing:-.01em
}

/* 선택 노드 액션바 */
.actionbar{
  position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;padding:9px;border-radius:17px;background:rgba(30,35,42,.97);
  border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.55);
  z-index:8;max-width:520px;margin:0 auto
}
.abTitle{font-size:11.5px;color:var(--dim);padding:1px 4px 9px;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abTitle b{color:var(--txt);font-weight:700;font-size:13px}
.abRow{display:flex;gap:6px}
.abtn{flex:1;min-width:0;height:50px;border-radius:11px;background:var(--panel2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600;color:var(--dim);border:1px solid transparent}
.abtn i{display:block;width:17px;height:17px}
.abtn:hover{background:#333B45;color:var(--txt)}
.abtn.on{background:var(--accent);color:var(--accentTxt)}
.abtn.danger:hover{background:#4A2A2A;color:#F0A5A5}

/* 안내 배너 */
.hintbar{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;
  background:rgba(30,35,42,.96);border:1px solid var(--accent);color:var(--txt);
  padding:9px 15px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap
}
.hintbar b{color:var(--accent)}

/* ---------- 서랍 ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,12,.6);backdrop-filter:blur(3px);z-index:20;opacity:0;transition:.2s}
.scrim.show{opacity:1}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,88vw);background:var(--panel);
  border-left:1px solid var(--line);z-index:21;transform:translateX(102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column
}
.drawer.open{transform:none}
.drawerHead{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 12px;border-bottom:1px solid var(--line)}
.drawerHead h3{margin:0;font-size:16px;letter-spacing:.02em}
.drawerBody{flex:1;overflow:auto;padding:10px 12px 24px;-webkit-overflow-scrolling:touch}
.mapItem{
  display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;border:1px solid var(--line);
  background:#1A1F25;margin-bottom:9px;cursor:pointer;transition:.15s
}
.mapItem:hover{border-color:var(--accent)}
.mapItem .swatch{width:30px;height:38px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.mapItem .swatch i{position:absolute;left:50%;top:50%;width:11px;height:8px;border-radius:99px;transform:translate(-50%,-50%)}
.mapItem .meta{flex:1;min-width:0}
.mapItem .meta strong{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapItem .meta span{font-size:11.5px;color:var(--dim)}
.mapItem .del{width:34px;height:34px;border-radius:9px;color:#6C7683;font-size:15px;flex:0 0 auto}
.mapItem .del:hover{background:#4A2A2A;color:#F0A5A5}
.empty{text-align:center;color:var(--dim);font-size:13.5px;padding:44px 20px;line-height:1.7}

/* ---------- 모달 ---------- */
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(430px,92vw);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;z-index:30;
  padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.6);max-height:86vh;overflow:auto
}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{margin:0 0 16px;font-size:12.5px;color:var(--dim);line-height:1.55}
.modalBtns{display:flex;gap:8px;margin-top:16px}
.modalBtns .btn{flex:1}

/* 테마 선택 */
.themeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.themeCard{
  border:1.5px solid var(--line);border-radius:12px;padding:9px;display:flex;gap:9px;align-items:center;transition:.15s
}
.themeCard:hover{border-color:#5B6572}
.themeCard.on{border-color:var(--accent)}
.themeCard .prev{width:34px;height:44px;border-radius:5px;position:relative;overflow:hidden;flex:0 0 auto;border:1px solid rgba(255,255,255,.09)}
.themeCard .prev i{position:absolute;border-radius:99px}
.themeCard .prev i.c{left:50%;top:50%;width:14px;height:9px;transform:translate(-50%,-50%)}
.themeCard .prev i.s{width:9px;height:6px}
.themeCard .nm{font-size:12.5px;font-weight:600;text-align:left;line-height:1.35}
.themeCard .nm em{display:block;font-style:normal;font-size:10.5px;color:var(--dim);font-weight:500}

.segrow{display:flex;gap:7px}
.seg{flex:1;height:42px;border-radius:11px;border:1px solid var(--line);background:#12161A;font-size:13.5px;font-weight:600;color:var(--dim)}
.seg.on{background:var(--accent);color:var(--accentTxt);border-color:transparent}
.setRow{padding:14px 0;border-bottom:1px solid var(--line)}
.setRow:last-of-type{border-bottom:0}

/* 토스트 */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:#2B323A;border:1px solid var(--line);padding:11px 18px;border-radius:999px;font-size:13.5px;
  z-index:60;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;max-width:90vw
}
.toast.show{opacity:1;transform:translateX(-50%)}

/* SVG 노드 */
#sheet,#sheet *{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#sheet{touch-action:none}
#sheet .node{cursor:grab}
#sheet .edge{cursor:pointer}
#sheet .node.dragging{cursor:grabbing}
.spin{animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-width:420px){
  .actionbar .who{display:none}
  .abtn{font-size:10px}
}
</style>
</head>
<body>

<!-- ============ 1. 로그인 ============ -->
<div id="authView">
  <svg class="brandmark" viewBox="0 0 100 100" fill="none">
    <line x1="50" y1="50" x2="22" y2="26" stroke="#4CAF7D" stroke-width="2.4"/>
    <line x1="50" y1="50" x2="80" y2="30" stroke="#4CAF7D" stroke-width="2.4"/>
    <line x1="50" y1="50" x2="26" y2="74" stroke="#4CAF7D" stroke-width="2.4"/>
    <line x1="50" y1="50" x2="78" y2="72" stroke="#4CAF7D" stroke-width="2.4"/>
    <line x1="80" y1="30" x2="92" y2="52" stroke="#4CAF7D" stroke-width="1.6" opacity=".6"/>
    <ellipse cx="50" cy="50" rx="19" ry="13" fill="#4CAF7D"/>
    <ellipse cx="22" cy="26" rx="11" ry="7.5" fill="#1E232A" stroke="#4CAF7D" stroke-width="2"/>
    <ellipse cx="80" cy="30" rx="12" ry="8.5" fill="#1E232A" stroke="#4CAF7D" stroke-width="2.6"/>
    <ellipse cx="26" cy="74" rx="10" ry="7" fill="#1E232A" stroke="#4CAF7D" stroke-width="2"/>
    <ellipse cx="78" cy="72" rx="10" ry="7" fill="#1E232A" stroke="#4CAF7D" stroke-width="2"/>
    <ellipse cx="92" cy="52" rx="6" ry="4.5" fill="#1E232A" stroke="#4CAF7D" stroke-width="1.6"/>
  </svg>
  <h1 class="brandtitle">MINDMAP</h1>
  <p class="brandsub">흩어놓은 생각에서 중심축을 찾는다</p>

  <div class="authbox">
    <div>
      <label class="lbl" for="email">이메일</label>
      <input id="email" class="field" type="email" autocomplete="username" placeholder="name@example.com">
    </div>
    <div>
      <label class="lbl" for="pw">비밀번호</label>
      <input id="pw" class="field" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button id="btnLogin" class="btn primary wide">로그인</button>
    <p id="authMsg" class="msg"></p>
    <button id="btnGuest" class="btn ghost wide hidden">이 기기에만 저장하고 시작</button>
  </div>
</div>

<!-- ============ 2. 시작 화면 ============ -->
<div id="startView" class="hidden">
  <div class="startTop">
    <h2>MINDMAP</h2>
    <button class="iconbtn" id="btnLogout" title="로그아웃">⏻</button>
  </div>
  <p style="margin:0 0 6px;font-size:13px;color:var(--dim)" id="whoami"></p>

  <button class="card" id="btnNew">
    <div class="big">＋</div>
    <div><h3>새로 만들기</h3><p>A4 한 장 위에 주제 하나를 놓고 시작합니다</p></div>
  </button>
  <button class="card" id="btnOpen">
    <div class="big">🗂</div>
    <div><h3>불러오기</h3><p>그동안 정리한 마인드맵을 엽니다</p></div>
  </button>

  <div class="sectionTitle">최근 작업</div>
  <div id="recentList"></div>
</div>

<!-- ============ 3. 에디터 ============ -->
<div id="appView" class="hidden">
  <div class="topbar">
    <button class="iconbtn" id="btnBack" title="처음으로">←</button>
    <div class="docTitle" id="docTitle">제목 없음</div>
    <span class="saveDot" id="saveDot"></span>
    <button class="toolbtn" id="btnTidy"><i data-icon="tidy"></i>정렬</button>
    <button class="toolbtn" id="btnExport"><i data-icon="down"></i>내려받기</button>
    <button class="toolbtn" id="btnSettings"><i data-icon="gear"></i>설정</button>
  </div>

  <div id="stage">
    <div id="viewport"><div id="sheetWrap"><svg id="sheet"></svg></div></div>

    <div class="hubbar" id="hubbar"></div>

    <div class="zoomer">
      <button class="fab" id="btnAdd" title="키워드 추가">＋</button>
    </div>

    <div class="tapTip hidden" id="tapTip">키워드를 누르면 연결·수정·삭제</div>

    <div class="actionbar hidden" id="actionbar">
      <div class="abTitle"><b id="selName"></b> 선택됨</div>
      <div class="abRow">
        <button class="abtn" id="aAdd"><i data-icon="plus"></i>이어서 추가</button>
        <button class="abtn" id="aLink"><i data-icon="link"></i>연결</button>
        <button class="abtn" id="aEdit"><i data-icon="pen"></i>수정</button>
        <button class="abtn" id="aPin"><i data-icon="pin"></i><span id="aPinLabel">고정</span></button>
        <button class="abtn danger" id="aDel"><i data-icon="trash"></i>삭제</button>
      </div>
    </div>

    <div id="edgeSwipe"></div>

    <div class="hintbar hidden" id="hintbar"><b>연결하거나 끊을 키워드</b>를 누르세요 <button class="btn sm" id="hintCancel">취소</button></div>
  </div>
</div>

<!-- ============ 우측 서랍 손잡이 ============ -->
<button class="drawerTab hidden" id="drawerTab"><i data-icon="drawer"></i><span>보관함</span></button>

<!-- ============ 서랍 ============ -->
<div class="scrim hidden" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawerHead">
    <h3>보관함</h3>
    <button class="iconbtn" id="btnDrawerClose">✕</button>
  </div>

/* ==========================================================================

const A4 = {w:595.28, h:841.89};       // pt 단위 = PDF와 1:1
const MARGIN = 30;
let FB = null, MODE = "local", USER = null;

async function initFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("여기에")===0) return null;
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";

  ]);

const LocalStore = {
  key:"mindmap.maps.v1",
  all(){ try{ return JSON.parse(localStorage.getItem(this.key)||"[]"); }catch(e){ return []; } },
  save(list){ localStorage.setItem(this.key, JSON.stringify(list)); },
  async list(){ return this.all().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); },
  async put(doc){
    const l=this.all(); const i=l.findIndex(x=>x.id===doc.id);
    if(i>=0) l[i]=doc; else l.push(doc);
    this.save(l); return doc.id;
  },
  async get(id){ return this.all().find(x=>x.id===id)||null; },
  async remove(id){ this.save(this.all().filter(x=>x.id!==id)); }
};

const CloudStore = {
  col(){ return FB.F.collection(FB.db, "users", USER.uid, "maps"); },
  async list(){
    const q = FB.F.query(this.col(), FB.F.orderBy("updatedAt","desc"), FB.F.limit(200));
    const s = await FB.F.getDocs(q);
    return s.docs.map(d=>({id:d.id, ...d.data()}));
  },
  async put(doc){
    const {id, ...rest} = doc;
    await FB.F.setDoc(FB.F.doc(FB.db,"users",USER.uid,"maps",id), rest, {merge:false});
    return id;
  },
  async get(id){
    const s = await FB.F.getDoc(FB.F.doc(FB.db,"users",USER.uid,"maps",id));
    return s.exists() ? {id:s.id, ...s.data()} : null;
  },
  async remove(id){ await FB.F.deleteDoc(FB.F.doc(FB.db,"users",USER.uid,"maps",id)); }
};
const Store = () => (MODE==="cloud" ? CloudStore : LocalStore);

let S = null;          // 현재 문서
let SHEET = {w:900, h:640};   // 시트 = 화면 전체 (CSS px)
let sel = null;        // 선택된 노드 id
let linkMode = false;
let dirty = false, saveTimer = null;
let tipSeen = (()=>{ try{ return localStorage.getItem("mindmap.tipSeen")==="1"; }catch(e){ return false; } })();
let anim = {alpha:0, raf:0};

const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];

/* 선으로 그린 아이콘 — 이모지보다 기기별 편차가 없다 */
const ICONS = {

const uid = ()=> Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc = s=>String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function blankDoc(title){
  const w = A4.w, h = A4.h;
  return {
    id: uid(), title: title, theme:"sprout", font:"gowun", orientation:"portrait", curve:"curve", hubMin:3,
    nodes:[{id:"root", text:title, x:w/2, y:h/2, pinned:true}],
    edges:[], createdAt:Date.now(), updatedAt:Date.now()
  };
}
const sheetSize = ()=> SHEET;
function measureStage(){
  const st=$("#stage");
  const w=Math.max(320, st.clientWidth), h=Math.max(320, st.clientHeight);
  const changed = (w!==SHEET.w || h!==SHEET.h);
  if(changed && S){
    const sx=w/SHEET.w, sy=h/SHEET.h;

  }

/* ==========================================================================
   4. 측정 · 노드 스타일
   ========================================================================== */
const FONTS = [
  {id:"gowun",   name:"고운돋움",  css:'"Gowun Dodum", sans-serif'},
  {id:"batang",  name:"고운바탕",  css:'"Gowun Batang", serif'},
  {id:"myeongjo",name:"나눔명조",  css:'"Nanum Myeongjo", serif'},
  {id:"plex",    name:"플렉스고딕", css:'"IBM Plex Sans KR", sans-serif'},
  {id:"jua",     name:"주아",     css:'"Jua", sans-serif'},
  {id:"gaegu",   name:"개구",     css:'"Gaegu", cursive'}
];
const fontCSS = ()=> (FONTS.find(f=>f.id===((S&&S.font)||"gowun"))||FONTS[0]).css;
const mctx = document.createElement("canvas").getContext("2d");
function measure(text, size, weight){
  mctx.font = `${weight} ${size}px ${fontCSS()}`;
  return mctx.measureText(text).width;
}
function wrap(text, maxChars){
  const t = String(text).trim();
  if(t.length<=maxChars) return [t];
  const words = t.split(/\s+/);
  const lines=[]; let cur="";
  const push=()=>{ if(cur){lines.push(cur); cur="";} };
  for(const w of words){
    if(!cur) cur=w;
    else if((cur+" "+w).length<=maxChars) cur+=" "+w;
    else { push(); cur=w; }
  }
  push();
  const out=[];
  for(let l of lines){
    while(l.length>maxChars){ out.push(l.slice(0,maxChars)); l=l.slice(maxChars); }
    out.push(l);
  }
  const res = out.filter(Boolean).slice(0,3);
  if(out.length>3) res[2] = res[2].slice(0,maxChars-1)+"…";
  return res;
}

let degCache = new Map();
function recompute(){
  degCache = new Map();
  S.nodes.forEach(n=>degCache.set(n.id,0));
  S.edges.forEach(e=>{
    degCache.set(e.a,(degCache.get(e.a)||0)+1);
    degCache.set(e.b,(degCache.get(e.b)||0)+1);
  });
  // 깊이(root 기준 BFS)
  const adj = new Map(); S.nodes.forEach(n=>adj.set(n.id,[]));
  S.edges.forEach(e=>{ if(adj.has(e.a)&&adj.has(e.b)){ adj.get(e.a).push(e.b); adj.get(e.b).push(e.a); }});
  const depth = new Map([["root",0]]);
  const q=["root"];
  while(q.length){ const c=q.shift(); for(const nb of (adj.get(c)||[])) if(!depth.has(nb)){ depth.set(nb, depth.get(c)+1); q.push(nb);} }
  S.nodes.forEach(n=>{ n._deg = degCache.get(n.id)||0; n._depth = depth.has(n.id)?depth.get(n.id):1; });
}

/** 연결 횟수에 따라 커지고 굵어진다 = 중심축의 시각화 */
let SCALE_OVERRIDE = null;   // 내보내기(A4 인쇄) 전용 배율
function scaleFactor(){
  if(SCALE_OVERRIDE) return SCALE_OVERRIDE;
  return Math.max(.92, Math.min(1.7, Math.min(SHEET.w,SHEET.h)/430));
}
/* 한 줄에 몇 글자까지 담을지 — 시트 폭에서 거꾸로 계산한다 */
function maxCharsFor(size, isRoot){
  const avail = SHEET.w*(isRoot?0.40:0.38);
  return Math.max(5, Math.min(isRoot?13:10, Math.floor(avail/(size*0.95))));
}
function styleOf(n){
  const hubMin = S.hubMin||3, superMin = hubMin+2, SC = scaleFactor();
  const len = String(n.text||"").length;
  let level = 0, size = 17*SC, weight = 400;
  if(n.id==="root"){ level=3; weight=700; size = (len>14?19 : len>8?23 : 27)*SC; }
  else if(n._deg>=superMin){ level=2; size=25*SC; weight=700; }
  else if(n._deg>=hubMin){ level=1; size=21*SC; weight=700; }
  const lines = wrap(n.text, maxCharsFor(size, n.id==="root"));
  let wMax=0; lines.forEach(l=> wMax=Math.max(wMax, measure(l,size,weight)));
  const padX = (level>=2?22:16)*SC, padY = (level>=2?13:10)*SC;
  const lh = size*1.28;
  const rx = Math.max(wMax/2+padX, 34*scaleFactor());
  const ry = Math.max((lines.length*lh)/2+padY, size*0.95);
  return {level,size,weight,lines,rx,ry,lh};
}
function styles(){ const m=new Map(); S.nodes.forEach(n=>m.set(n.id,styleOf(n))); return m; }

/* ==========================================================================
   5. 자동 정렬 — 방사형 링 + 반발 + 스프링
      "중심에서 뻗어나가되 서로 겹치지 않는다"
   ========================================================================== */
function layout(ticks){
  recompute();
  const st = styles();
  const sz = sheetSize();
  const cx = sz.w/2, cy = sz.h/2;
  const root = S.nodes.find(n=>n.id==="root");
  if(!root) return;
  root.x = cx; root.y = cy;

  /* 1) 가지 구조 — 먼저 이어진 선이 부모가 된다. 나중에 더한 연결은 가로지르는 선으로만 그린다. */
  const adj = new Map(); S.nodes.forEach(n=>adj.set(n.id,[]));
  S.edges.forEach(e=>{ if(adj.has(e.a)&&adj.has(e.b)){ adj.get(e.a).push(e.b); adj.get(e.b).push(e.a); }});
  const children = new Map(); S.nodes.forEach(n=>children.set(n.id,[]));
  const seen = new Set(["root"]), order = [], q = ["root"];
  while(q.length){
    const c = q.shift(); order.push(c);
    for(const nb of adj.get(c)||[]) if(!seen.has(nb)){ seen.add(nb); children.get(c).push(nb); q.push(nb); }
  }
  S.nodes.forEach(n=>{ if(!seen.has(n.id)){ seen.add(n.id); children.get("root").push(n.id); order.push(n.id); }});

  /* 2) 가지마다 끝가지 수를 세어 각도를 나눠 갖는다 = 굵은 가지가 넓은 부채꼴을 차지 */
  const leaves = new Map();
  for(let i=order.length-1;i>=0;i--){
    const id = order[i], ch = children.get(id);
    leaves.set(id, ch.length ? ch.reduce((s,c)=>s+(leaves.get(c)||1),0) : 1);
  }
  const angle = new Map(), depth = new Map();
  (function assign(id, a0, a1, d){
    depth.set(id, d);
    angle.set(id, (a0+a1)/2);
    const ch = children.get(id); if(!ch.length) return;
    const total = leaves.get(id)||1;
    let a = a0;
    ch.forEach(c=>{ const span=(a1-a0)*((leaves.get(c)||1)/total); assign(c, a, a+span, d+1); a+=span; });
  })("root", -Math.PI/2, Math.PI*1.5, 0);

  /* 3) A4 비율에 맞춘 타원 링 — 세로 종이는 세로로 더 넓게 퍼진다 */
  const maxDepth = Math.max(1, ...[...depth.values()]);
  const rim = S.nodes.filter(n=>n.id!=="root").map(n=>st.get(n.id));
  const mid = (arr)=> arr.length ? arr.slice().sort((a,b)=>a-b)[Math.floor(arr.length/2)] : 40;
  const rimX = Math.min(mid(rim.map(o=>o.rx)), sz.w*0.16);
  const rimY = Math.min(mid(rim.map(o=>o.ry)), sz.h*0.14);
  const RX = Math.max(70, sz.w/2 - MARGIN - rimX*0.95);
  const RY = Math.max(70, sz.h/2 - MARGIN - rimY*0.95);
  const rootS = st.get("root") || {rx:40, ry:30};
  const inX = Math.min(RX*0.62, rootS.rx + rimX + 16);
  const inY = Math.min(RY*0.62, rootS.ry + rimY + 16);
  const spanX = Math.max(16, RX-inX), spanY = Math.max(16, RY-inY);
  const target = new Map();
  S.nodes.forEach(n=>{
    const d = depth.get(n.id)||1, a = angle.get(n.id)||0;
    const t = maxDepth<=1 ? 1 : (d-1)/(maxDepth-1);
    target.set(n.id, {x: cx+Math.cos(a)*(inX+spanX*t), y: cy+Math.sin(a)*(inY+spanY*t)});
  });

  /* 4) 자리 다듬기 — 목표로 끌어당기고, 겹치면 밀어낸다 */
  const N = S.nodes;
  for(let t=0;t<ticks;t++){
    const ease = 0.10 + 0.12*(1-t/ticks);
    N.forEach(n=>{
      if(n.id==="root"||n.pinned) return;
      const g = target.get(n.id); if(!g) return;
      n.x += (g.x-n.x)*ease;
      n.y += (g.y-n.y)*ease;
    });
    for(let pass=0;pass<2;pass++)
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const a=N[i], b=N[j], sa=st.get(a.id), sb=st.get(b.id);
      let dx=b.x-a.x, dy=b.y-a.y;
      let d=Math.hypot(dx,dy)||0.01;
      const min = Math.max(sa.rx,sa.ry)+Math.max(sb.rx,sb.ry)+9;
      if(d<min){
        const push=(min-d)/2, ux=dx/d, uy=dy/d;
        const aFix = a.id==="root"||a.pinned, bFix = b.id==="root"||b.pinned;
        if(!aFix){ a.x-=ux*(bFix?push*2:push); a.y-=uy*(bFix?push*2:push); }
        if(!bFix){ b.x+=ux*(aFix?push*2:push); b.y+=uy*(aFix?push*2:push); }
      }
    }
    N.forEach(n=>{
      const s=st.get(n.id);
      n.x = Math.max(MARGIN+s.rx, Math.min(sz.w-MARGIN-s.rx, n.x));
      n.y = Math.max(MARGIN+s.ry, Math.min(sz.h-MARGIN-s.ry, n.y));
    });
  }

  /* 마무리: 끌어당김 없이 겹침만 푼다 (가장자리에 몰린 것까지 정리) */
  for(let t=0;t<60;t++){
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const a=N[i], b=N[j], sa=st.get(a.id), sb=st.get(b.id);
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
      const min = Math.max(sa.rx,sa.ry)+Math.max(sb.rx,sb.ry)+8;
      if(d<min){
        const push=(min-d)/2, ux=dx/d, uy=dy/d;
        const aFix=a.id==="root", bFix=b.id==="root";
        if(!aFix){ a.x-=ux*(bFix?push*2:push); a.y-=uy*(bFix?push*2:push); }
        if(!bFix){ b.x+=ux*(aFix?push*2:push); b.y+=uy*(aFix?push*2:push); }
      }
    }
    N.forEach(n=>{
      const s=st.get(n.id);
      n.x = Math.max(MARGIN+s.rx, Math.min(sz.w-MARGIN-s.rx, n.x));
      n.y = Math.max(MARGIN+s.ry, Math.min(sz.h-MARGIN-s.ry, n.y));
    });
  }
}
function relayout(ticks=240){ layout(ticks); render(); markDirty(); }

/* ==========================================================================
   6. 렌더링
   ========================================================================== */
function buildSVG({forExport=false}={}){
  const T = themeById(S.theme), sz = sheetSize();
  recompute();
  const st = styles();
  const P=[];
  P.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sz.w} ${sz.h}" width="${sz.w}" height="${sz.h}" font-family='${fontCSS()}'>`);
  P.push(`<defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="${T.grid}" stroke-width="1"/></pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="${T.hubS}" flood-opacity=".28"/></filter>
  </defs>`);
  P.push(`<rect width="${sz.w}" height="${sz.h}" fill="${T.bg}"/>`);
  P.push(`<rect width="${sz.w}" height="${sz.h}" fill="url(#grid)" opacity=".55"/>`);

  // 연결선
  const maxDeg = Math.max(1, ...S.nodes.filter(n=>n.id!=="root").map(n=>n._deg||0));
  S.edges.forEach(e=>{
    if(!e.id) e.id = uid();
    const a=S.nodes.find(n=>n.id===e.a), b=S.nodes.find(n=>n.id===e.b);
    if(!a||!b) return;
    const w = 1.1 + 2.2*(Math.max(a._deg,b._deg)/Math.max(2,maxDeg));
    let d;
    if(S.curve==="straight"){ d=`M${a.x} ${a.y} L${b.x} ${b.y}`; }
    else{
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const dx=b.x-a.x, dy=b.y-a.y;
      d=`M${a.x} ${a.y} Q${mx-dy*0.11} ${my+dx*0.11} ${b.x} ${b.y}`;
    }
    if(!forExport) P.push(`<path class="edge" data-id="${e.id}" d="${d}" fill="none" stroke="#000" stroke-opacity="0" stroke-width="22" pointer-events="stroke"/>`);
    const hot = (sel && (e.a===sel||e.b===sel));
    P.push(`<path d="${d}" fill="none" stroke="${hot?T.hubS:T.line}" stroke-width="${(hot?w+0.8:w).toFixed(2)}" stroke-linecap="round" opacity="${hot?1:.85}" pointer-events="none"/>`);
  });

  // 노드
  S.nodes.forEach(n=>{
    const s = st.get(n.id);
    const isRoot = n.id==="root";
    const fill = isRoot?T.root : s.level>=1?T.hub : T.node;
    const stroke = isRoot?T.rootS : s.level>=1?T.hubS : T.nodeS;
    const ink = isRoot?T.inkHub : s.level>=1?T.inkHub : T.inkOn;
    const sw = isRoot?3 : s.level>=2?2.6 : s.level>=1?2.2 : 1.6;
    const filt = (s.level>=2||isRoot) ? ' filter="url(#soft)"' : "";
    const cls = forExport?"":` class="node" data-id="${n.id}"`;
    P.push(`<g${cls}${filt}>`);
    P.push(`<ellipse cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" rx="${s.rx.toFixed(1)}" ry="${s.ry.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
    const total=(s.lines.length-1)*s.lh;
    s.lines.forEach((ln,i)=>{
      const y = n.y - total/2 + i*s.lh + s.size*0.35;
      P.push(`<text x="${n.x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="${s.size}" font-weight="${s.weight}" fill="${ink}" letter-spacing="-0.2" pointer-events="none">${esc(ln)}</text>`);
    });
    if(!forExport && sel===n.id){
      P.push(`<ellipse cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" rx="${(s.rx+9).toFixed(1)}" ry="${(s.ry+9).toFixed(1)}" fill="none" stroke="${T.accent}" stroke-width="2" stroke-dasharray="6 5" opacity=".95"/>`);
    }
    if(n.pinned && !isRoot){
      P.push(`<circle cx="${(n.x+s.rx-3).toFixed(1)}" cy="${(n.y-s.ry+3).toFixed(1)}" r="3.4" fill="${T.rootS}" opacity=".8"/>`);
    }
    P.push(`</g>`);
  });

  P.push(`</svg>`);
  return P.join("");
}

function render(){
  if(!S) return;
  const sz = sheetSize();
  const svg = $("#sheet");
  svg.setAttribute("viewBox",`0 0 ${sz.w} ${sz.h}`);
  svg.setAttribute("width",sz.w); svg.setAttribute("height",sz.h);
  svg.innerHTML = buildSVG().replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"");
  $("#docTitle").textContent = S.title || "제목 없음";
  const T = themeById(S.theme);
  const R = document.documentElement.style;
  R.setProperty("--accent", T.accent);
  R.setProperty("--sheetFont", fontCSS());
  R.setProperty("--sheetInk", T.ink);
  R.setProperty("--sheetLine", T.line);
  renderHubs();
  renderActionbar();
}
function renderHubs(){
  const arr = S.nodes.filter(n=>n.id!=="root").sort((a,b)=>b._deg-a._deg).slice(0,3).filter(n=>n._deg>=2);
  $("#hubbar").innerHTML = arr.length
    ? `<div class="hubchip">중심축</div>` + arr.map(n=>`<div class="hubchip"><b>${esc(n.text)}</b> ${n._deg}</div>`).join("")
    : "";
}
function renderActionbar(){
  const bar = $("#actionbar"), tip = $("#tapTip");
  const fab = document.querySelector(".zoomer");
  if(!sel){
    bar.classList.add("hidden");
    fab.classList.remove("hidden");
    tip.classList.toggle("hidden", tipSeen || S.nodes.length<2);
    return;
  }
  tip.classList.add("hidden");
  fab.classList.add("hidden");
  if(!tipSeen){ tipSeen=true; try{ localStorage.setItem("mindmap.tipSeen","1"); }catch(e){} }
  const n = S.nodes.find(x=>x.id===sel);
  if(!n){ sel=null; bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  $("#selName").textContent = n.text;
  $("#aPin").classList.toggle("on", !!n.pinned);
  $("#aPinLabel").textContent = n.pinned ? "고정해제" : "고정";
  $("#aLink").classList.toggle("on", linkMode);
  $("#aDel").style.display = n.id==="root" ? "none" : "";
  $("#aPin").style.display = n.id==="root" ? "none" : "";
}
function fitSheet(){
  const changed = measureStage();
  const svg=$("#sheet");
  svg.setAttribute("viewBox",`0 0 ${SHEET.w} ${SHEET.h}`);
  if(changed && S){ layout(200); }
  render();
}

/* 화면은 고정. 노드를 끌어 옮기는 것만 가능하다. */
(function bindStage(){
  const vp = $("#viewport");
  let drag=null, tapEdge=null;
  function toSheet(cx,cy){ const r=$("#stage").getBoundingClientRect(); return {x:cx-r.left, y:cy-r.top}; }

  vp.addEventListener("contextmenu", e=>e.preventDefault());
  vp.addEventListener("selectstart", e=>e.preventDefault());
  vp.addEventListener("pointerdown", e=>{
    if(e.cancelable) e.preventDefault();
    const g = e.target.closest && e.target.closest(".node");
    const ln = !g && e.target.closest && e.target.closest(".edge");
    if(ln && !linkMode){ tapEdge={id:ln.dataset.id, x:e.clientX, y:e.clientY}; return; }
    if(g){
      const id = g.dataset.id;
      if(linkMode && sel){
        if(id!==sel){ doLink(sel,id); return; }
        linkMode=false; $("#hintbar").classList.add("hidden"); render(); return;
      }
      sel = id; render();
      const n = S.nodes.find(x=>x.id===id);
      const p = toSheet(e.clientX,e.clientY);
      drag = {id, ox:p.x-n.x, oy:p.y-n.y, moved:false};
      vp.setPointerCapture(e.pointerId);
    }else{
      if(sel||linkMode){ sel=null; linkMode=false; $("#hintbar").classList.add("hidden"); render(); }
    }
  });
  vp.addEventListener("pointermove", e=>{
    if(!drag) return;
    const n = S.nodes.find(x=>x.id===drag.id); if(!n) return;
    const p = toSheet(e.clientX,e.clientY);
    n.x = p.x-drag.ox; n.y = p.y-drag.oy;
    drag.moved = true;
    n.x=Math.max(MARGIN,Math.min(SHEET.w-MARGIN,n.x));
    n.y=Math.max(MARGIN,Math.min(SHEET.h-MARGIN,n.y));
    render();
  });
  vp.addEventListener("pointerup", e=>{
    if(tapEdge){
      const t=tapEdge; tapEdge=null;
      if(Math.abs(e.clientX-t.x)<12 && Math.abs(e.clientY-t.y)<12) unlink(t.id);
      return;
    }
    if(drag && drag.moved){
      const n=S.nodes.find(x=>x.id===drag.id);
      if(n && n.id!=="root") n.pinned=true;
      markDirty(); render();
    }
    drag=null;
  });
  vp.addEventListener("pointercancel",()=>{ drag=null; tapEdge=null; });
  let rz;
  window.addEventListener("resize", ()=>{ if(!S) return; clearTimeout(rz); rz=setTimeout(fitSheet,180); });
})();

/* ==========================================================================
   8. 편집 동작
   ========================================================================== */
function addKeywords(text, parentId){
  const parts = String(text).split(/[\n,·|]/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return 0;
  const parent = S.nodes.find(n=>n.id===parentId) || S.nodes[0];
  const sz = sheetSize();
  const base = Math.atan2(parent.y-sz.h/2, parent.x-sz.w/2) || (Math.random()*6.28);
  parts.forEach((txt,i)=>{
    const ang = base + (i-(parts.length-1)/2)*0.55 + (Math.random()-.5)*0.3;
    const dist = 110 + Math.random()*30;
    const id = uid();
    S.nodes.push({
      id, text:txt.slice(0,40),
      x: Math.max(MARGIN+40, Math.min(sz.w-MARGIN-40, parent.x+Math.cos(ang)*dist)),
      y: Math.max(MARGIN+30, Math.min(sz.h-MARGIN-30, parent.y+Math.sin(ang)*dist)),
      pinned:false
    });
    S.edges.push({id:uid(), a:parent.id, b:id});
    if(i===parts.length-1) sel = id;
  });
  layout(200); render(); markDirty();
  return parts.length;
}
function nodeText(id){ const n=S.nodes.find(x=>x.id===id); return n?n.text:"?"; }
function unlink(edgeId, quiet){
  const i = S.edges.findIndex(e=>e.id===edgeId);
  if(i<0) return;
  const e = S.edges[i];
  const done = ()=>{
    S.edges.splice(i,1);
    layout(220); render(); markDirty();
    if(!quiet) toast("연결을 끊었습니다");
  };
  confirmBox("이 연결을 끊을까요?",
    `“${nodeText(e.a)}” 와 “${nodeText(e.b)}” 사이의 선만 지웁니다. 키워드는 그대로 남습니다.`, done);
}
function doLink(a,b){
  linkMode=false; $("#hintbar").classList.add("hidden");
  const found = S.edges.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));
  if(found){ render(); unlink(found.id); return; }
  S.edges.push({id:uid(), a, b});
  layout(180); render(); markDirty(); toast("연결했습니다");
}
function deleteNode(id){
  if(id==="root") return;
  S.nodes = S.nodes.filter(n=>n.id!==id);
  S.edges = S.edges.filter(e=>e.a!==id && e.b!==id);
  sel=null; layout(180); render(); markDirty();
}

/* ==========================================================================
   9. 저장
   ========================================================================== */
function markDirty(){
  dirty=true; $("#saveDot").textContent="•";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow, 1400);
}
async function saveNow(){
  if(!S) return;
  S.updatedAt = Date.now();
  S.title = (S.nodes.find(n=>n.id==="root")||{}).text || S.title;
  const clean = JSON.parse(JSON.stringify(S, (k,v)=> k.startsWith("_")?undefined:v));
  try{
    await Store().put(clean);
    dirty=false; $("#saveDot").textContent="저장됨";
    setTimeout(()=>{ if(!dirty) $("#saveDot").textContent=""; }, 1600);
  }catch(e){
    console.error("[저장 실패]", e);
    const code = String((e && e.code) || e || "unknown");
    $("#saveDot").textContent = "저장 실패";
    let msg = "저장하지 못했습니다 · " + code;
    if(code.includes("permission-denied")) msg = "규칙에서 막혔습니다 · Firestore 규칙 확인";
    else if(code.includes("unauthenticated")) msg = "로그인이 풀렸습니다 · 다시 로그인해 주세요";
    else if(code.includes("not-found")) msg = "Firestore 데이터베이스가 없습니다 · 콘솔에서 먼저 만들기";
    else if(code.includes("unavailable")) msg = "네트워크 문제 · 잠시 후 다시 저장됩니다";
    else if(code.includes("invalid-argument")) msg = "저장할 수 없는 값이 있습니다 · " + code;
    toast(msg);
  }
}

/* ==========================================================================
   10. 내보내기
   ========================================================================== */
/* 화면은 웹폰트가 적용되지만 SVG를 이미지로 바꾸면 폰트가 빠진다.
   그래서 내보내기는 캔버스에 직접 그린다. A4 비율로 다시 정렬한 뒤 출력. */
async function drawA4(scale=3){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const a4 = S.orientation==="landscape" ? {w:A4.h,h:A4.w} : {w:A4.w,h:A4.h};
  const prev = SHEET;
  const saved = S.nodes.map(n=>({id:n.id,x:n.x,y:n.y}));
  S.nodes.forEach(n=>{ n.x*=a4.w/prev.w; n.y*=a4.h/prev.h; });
  SHEET = a4;
  SCALE_OVERRIDE = 1.05;
  layout(280);
  recompute();
  const T = themeById(S.theme), st = styles(), F = fontCSS();

  const c = document.createElement("canvas");
  c.width = Math.round(a4.w*scale); c.height = Math.round(a4.h*scale);
  const x = c.getContext("2d");
  x.scale(scale,scale);
  x.fillStyle = T.bg; x.fillRect(0,0,a4.w,a4.h);

  x.strokeStyle=T.grid; x.lineWidth=.7; x.globalAlpha=.55;
  for(let g=0; g<a4.w; g+=24){ x.beginPath(); x.moveTo(g,0); x.lineTo(g,a4.h); x.stroke(); }
  for(let g=0; g<a4.h; g+=24){ x.beginPath(); x.moveTo(0,g); x.lineTo(a4.w,g); x.stroke(); }
  x.globalAlpha=1;

  const maxDeg = Math.max(2, ...S.nodes.filter(n=>n.id!=="root").map(n=>n._deg||0));
  x.strokeStyle=T.line; x.lineCap="round"; x.globalAlpha=.85;
  S.edges.forEach(e=>{
    const a=S.nodes.find(n=>n.id===e.a), b=S.nodes.find(n=>n.id===e.b);
    if(!a||!b) return;
    x.lineWidth = 1.1 + 2.2*(Math.max(a._deg,b._deg)/maxDeg);
    x.beginPath(); x.moveTo(a.x,a.y);
    if(S.curve==="straight") x.lineTo(b.x,b.y);
    else{
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y;
      x.quadraticCurveTo(mx-dy*0.11, my+dx*0.11, b.x, b.y);
    }
    x.stroke();
  });
  x.globalAlpha=1;

  x.textAlign="center"; x.textBaseline="middle";
  S.nodes.forEach(n=>{
    const sy = st.get(n.id), isRoot = n.id==="root";
    x.beginPath(); x.ellipse(n.x, n.y, sy.rx, sy.ry, 0, 0, Math.PI*2);
    x.fillStyle = isRoot?T.root : sy.level>=1?T.hub : T.node;
    x.fill();
    x.strokeStyle = isRoot?T.rootS : sy.level>=1?T.hubS : T.nodeS;
    x.lineWidth = isRoot?3 : sy.level>=2?2.6 : sy.level>=1?2.2 : 1.6;
    x.stroke();
    x.fillStyle = isRoot?T.inkHub : sy.level>=1?T.inkHub : T.inkOn;
    x.font = `${sy.weight} ${sy.size}px ${F}`;
    const top = n.y - (sy.lines.length-1)*sy.lh/2;
    sy.lines.forEach((ln,i)=> x.fillText(ln, n.x, top+i*sy.lh));
  });

  x.textAlign="left"; x.fillStyle=T.line; x.font=`400 9.5px ${F}`;
  x.fillText(S.title||"", MARGIN, a4.h-14);

  SHEET = prev;
  SCALE_OVERRIDE = null;
  const back = new Map(saved.map(o=>[o.id,o]));
  S.nodes.forEach(n=>{ const o=back.get(n.id); if(o){ n.x=o.x; n.y=o.y; }});
  render();
  return {canvas:c, size:a4};
}
function download(url, name){
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
const safeName = ()=> (S.title||"마인드맵").replace(/[\\/:*?"<>|]/g,"_").slice(0,40);

async function exportPNG(){
  toast("이미지를 만드는 중…");
  const {canvas:c} = await drawA4(3);
  c.toBlob(b=>{
    const u=URL.createObjectURL(b);
    download(u, safeName()+".png");
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast("PNG로 저장했습니다");
  }, "image/png");
}
async function exportPDF(){
  toast("PDF를 만드는 중…");
  if(!window.jspdf){
    await new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload=res; s.onerror=rej; document.head.appendChild(s);
    }).catch(()=>{ toast("PDF 도구를 불러오지 못했습니다"); });
  }
  if(!window.jspdf) return;
  const {canvas:c, size:sz} = await drawA4(3);
  const pdf = new window.jspdf.jsPDF({orientation:S.orientation, unit:"pt", format:"a4"});
  pdf.addImage(c.toDataURL("image/jpeg",0.96), "JPEG", 0, 0, sz.w, sz.h);
  pdf.save(safeName()+".pdf");
  toast("PDF로 저장했습니다");
}
function exportJSON(){
  const clean = JSON.parse(JSON.stringify(S,(k,v)=>k.startsWith("_")?undefined:v));
  const b = new Blob([JSON.stringify(clean,null,2)],{type:"application/json"});
  const u = URL.createObjectURL(b);
  download(u, safeName()+".json");
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/* ==========================================================================
   11. UI 유틸
   ========================================================================== */
let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1900);
}
let uiOpenedAt = 0;   // 열자마자 들어오는 클릭을 걸러내기 위한 시각
function openModal(id){
  uiOpenedAt = Date.now();
  $("#scrim").classList.remove("hidden");
  requestAnimationFrame(()=>$("#scrim").classList.add("show"));
  $(id).classList.remove("hidden");
}
function closeModal(id){ $(id).classList.add("hidden"); if(!document.querySelector(".modal:not(.hidden)") && !$("#drawer").classList.contains("open")) hideScrim(); }
function hideScrim(){ const s=$("#scrim"); s.classList.remove("show"); setTimeout(()=>s.classList.add("hidden"),200); }
function confirmBox(title, body, onYes){
  $("#cfTitle").textContent=title; $("#cfBody").textContent=body;
  openModal("#mdConfirm");
  $("#cfYes").onclick=()=>{ closeModal("#mdConfirm"); onYes(); };
}
function openDrawer(){
  uiOpenedAt = Date.now();
  $("#scrim").classList.remove("hidden");
  requestAnimationFrame(()=>$("#scrim").classList.add("show"));
  $("#drawer").classList.add("open"); loadList();
}
function closeDrawer(){ $("#drawer").classList.remove("open"); if(!document.querySelector(".modal:not(.hidden)")) hideScrim(); }
$("#scrim").addEventListener("click", ()=>{
  if(Date.now()-uiOpenedAt < 450) return;   // 방금 연 창이 바로 닫히는 것 방지
  document.querySelectorAll(".modal").forEach(m=>m.classList.add("hidden"));
  if(window.resetKwModal) window.resetKwModal();
  closeDrawer(); hideScrim();
});

/* ==========================================================================
   12. 목록
   ========================================================================== */
function itemHTML(m){
  const T=themeById(m.theme);
  const d=new Date(m.updatedAt||Date.now());
  const dt=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  return `<div class="mapItem" data-id="${m.id}">
    <div class="swatch" style="background:${T.bg}"><i style="background:${T.root}"></i></div>
    <div class="meta"><strong>${esc(m.title||"제목 없음")}</strong>
      <span>${dt} · 키워드 ${(m.nodes||[]).length-1}개 · ${esc(T.name)}</span></div>
    <button class="del" data-del="${m.id}" title="삭제">🗑</button>
  </div>`;
}
async function loadList(){
  const body=$("#drawerBody");
  body.innerHTML=`<p class="empty"><span class="spin">◠</span><br>불러오는 중</p>`;
  let list=[];
  try{ list=await Store().list(); }catch(e){ console.error(e); }
  body.innerHTML = list.length
    ? list.map(itemHTML).join("")
    : `<p class="empty">아직 저장된 마인드맵이 없습니다.<br>주제 하나를 놓고 시작해 보세요.</p>`;
  body.querySelectorAll(".mapItem").forEach(el=>{
    el.addEventListener("click", async e=>{
      if(e.target.dataset.del) return;
      const doc = await Store().get(el.dataset.id);
      if(doc){ closeDrawer(); openDoc(doc); }
    });
  });
  body.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", e=>{
      e.stopPropagation();
      const id=b.dataset.del;
      confirmBox("이 마인드맵을 지울까요?","되돌릴 수 없습니다.", async ()=>{
        await Store().remove(id); loadList(); refreshRecent(); toast("삭제했습니다");
      });
    });
  });
}
async function refreshRecent(){
  let list=[];
  try{ list=(await Store().list()).slice(0,4); }catch(e){}
  const el=$("#recentList");
  el.innerHTML = list.length ? list.map(itemHTML).join("") : `<p class="empty" style="padding:22px">아직 없습니다.</p>`;
  el.querySelectorAll(".mapItem").forEach(x=>{
    x.addEventListener("click", async e=>{
      if(e.target.dataset.del) return;
      const doc=await Store().get(x.dataset.id); if(doc) openDoc(doc);
    });
  });
  el.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", e=>{
      e.stopPropagation();
      confirmBox("이 마인드맵을 지울까요?","되돌릴 수 없습니다.", async ()=>{
        await Store().remove(b.dataset.del); refreshRecent(); toast("삭제했습니다");
      });
    });
  });
}

/* ==========================================================================
   13. 화면 전환

function show(v){
  ["#authView","#startView","#appView"].forEach(x=>$(x).classList.add("hidden"));
  $(v).classList.remove("hidden");
  $("#drawerTab").classList.toggle("hidden", v==="#authView");
  paintIcons();
}
function openDoc(doc){
  S = Object.assign({curve:"curve", hubMin:3, orientation:"portrait", theme:"sprout", font:"gowun"}, doc);
  sel=null; linkMode=false; dirty=false;
  show("#appView");
  measureStage();
  $("#sheet").setAttribute("viewBox",`0 0 ${SHEET.w} ${SHEET.h}`);
  layout(260); render();
  $("#saveDot").textContent="";
}
function newDoc(){
  $("#titleInput").value="";
  openModal("#mdTitle");
  setTimeout(()=>$("#titleInput").focus(),120);
}

/* ==========================================================================
   14. 이벤트 연결
   ========================================================================== */
// 시작 화면
$("#btnNew").onclick = newDoc;
$("#btnOpen").onclick = openDrawer;
$("#drawerTab").onclick = openDrawer;
$("#btnDrawerClose").onclick = closeDrawer;

/* 오른쪽 가장자리를 왼쪽으로 쓸어도 서랍이 열린다 */
(function edgeSwipe(){
  const el = $("#edgeSwipe"); if(!el) return;
  let x0=null;
  el.addEventListener("pointerdown", e=>{ x0=e.clientX; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e=>{
    if(x0!==null && x0-e.clientX>38){ x0=null; openDrawer(); }
  });
  el.addEventListener("pointerup", e=>{ if(x0!==null && Math.abs(x0-e.clientX)<6) openDrawer(); x0=null; });
  el.addEventListener("pointercancel", ()=>x0=null);
})();

// 주제 모달
$("#titleCancel").onclick = ()=>closeModal("#mdTitle");
$("#titleOk").onclick = ()=>{
  const t=$("#titleInput").value.trim();
  if(!t){ toast("주제를 적어주세요"); return; }
  closeModal("#mdTitle");
  openDoc(blankDoc(t));
  markDirty();
};
$("#titleInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#titleOk").click(); });

// 키워드 모달
let kwParent = null;
function askKeyword(parentId){
  kwParent = parentId;
  const p = S.nodes.find(n=>n.id===parentId);
  $("#kwSub").textContent = p ? `“${p.text}” 에 이어서 붙습니다.` : "";
  $("#kwInput").value="";
  openModal("#mdKeyword");
  setTimeout(()=>$("#kwInput").focus(),120);
}
function resetKwModal(){
  $("#kwTitle").textContent="키워드 추가";
  $("#kwOk").onclick = kwAddHandler;
}
$("#kwCancel").onclick = ()=>{ closeModal("#mdKeyword"); resetKwModal(); };
$("#kwInput").addEventListener("keydown", e=>{
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) $("#kwOk").click();
});

// FAB · 액션바
$("#btnAdd").onclick = ()=> askKeyword(sel || "root");
$("#aAdd").onclick = ()=> askKeyword(sel);
$("#aLink").onclick = ()=>{
  linkMode=!linkMode;
  $("#hintbar").classList.toggle("hidden", !linkMode);
  renderActionbar();
};
$("#hintCancel").onclick = ()=>{ linkMode=false; $("#hintbar").classList.add("hidden"); renderActionbar(); };
$("#aEdit").onclick = ()=>{
  const n=S.nodes.find(x=>x.id===sel); if(!n) return;
  kwParent=null;
  $("#kwTitle").textContent="키워드 수정";
  $("#kwSub").textContent = n.id==="root" ? "주제를 고치면 제목도 함께 바뀝니다." : "";
  $("#kwInput").value=n.text;
  openModal("#mdKeyword");
  $("#kwOk").onclick = ()=>{
    const v=$("#kwInput").value.trim().split(/\n/)[0];
    if(!v){ toast("내용을 적어주세요"); return; }
    n.text=v.slice(0,40);
    if(n.id==="root") S.title=n.text;
    closeModal("#mdKeyword");
    resetKwModal();
    layout(120); render(); markDirty();
  };
};
const kwAddHandler = ()=>{
  const v=$("#kwInput").value.trim();
  if(!v){ toast("키워드를 적어주세요"); return; }
  closeModal("#mdKeyword");
  const n = addKeywords(v, kwParent||"root");
  toast(n>1?`${n}개를 붙였습니다`:"붙였습니다");
};
$("#kwOk").onclick = kwAddHandler;
window.resetKwModal = resetKwModal;

$("#aPin").onclick = ()=>{
  const n=S.nodes.find(x=>x.id===sel); if(!n||n.id==="root") return;
  n.pinned=!n.pinned;
  if(!n.pinned) layout(200);
  render(); markDirty();
  toast(n.pinned?"이 자리에 고정했습니다":"고정을 풀었습니다");
};
$("#aDel").onclick = ()=>{
  const n=S.nodes.find(x=>x.id===sel); if(!n) return;
  confirmBox("키워드를 지울까요?", `“${n.text}” 와 연결된 선이 함께 사라집니다.`, ()=>deleteNode(n.id));
};

// 상단
$("#btnBack").onclick = async ()=>{ await saveNow(); show("#startView"); refreshRecent(); };
$("#btnTidy").onclick = ()=>{
  S.nodes.forEach(n=>{ if(n.id!=="root") n.pinned=false; });
  relayout(320); toast("다시 정렬했습니다");
};
$("#docTitle").onclick = ()=>{ sel="root"; render(); $("#aEdit").click(); };

// 내보내기
$("#btnExport").onclick = ()=>openModal("#mdExport");
$("#expClose").onclick = ()=>closeModal("#mdExport");
$("#expPng").onclick = ()=>{ closeModal("#mdExport"); exportPNG(); };
$("#expPdf").onclick = ()=>{ closeModal("#mdExport"); exportPDF(); };
$("#expJson").onclick = ()=>{ closeModal("#mdExport"); exportJSON(); };

// 설정
function paintSettings(){
  $("#themeGrid").innerHTML = THEMES.map(t=>`
    <button class="themeCard ${S.theme===t.id?"on":""}" data-theme="${t.id}">
      <span class="prev" style="background:${t.bg}">
        <i class="c" style="background:${t.root}"></i>
        <i class="s" style="background:${t.hub};left:4px;top:7px"></i>
        <i class="s" style="background:${t.node};border:1px solid ${t.nodeS};right:3px;bottom:8px"></i>
      </span>
      <span class="nm">${t.name}<em>${t.desc}</em></span>
    </button>`).join("");
  $("#themeGrid").querySelectorAll("[data-theme]").forEach(b=>{
    b.onclick=()=>{ S.theme=b.dataset.theme; render(); markDirty(); paintSettings(); };
  });
  $("#fontGrid").innerHTML = FONTS.map(f=>`
    <button class="themeCard ${((S.font||"gowun")===f.id)?"on":""}" data-font="${f.id}" style="justify-content:center">
      <span class="nm" style="font-family:${f.css};font-size:16px;text-align:center;width:100%">${f.name}</span>
    </button>`).join("");
  $("#fontGrid").querySelectorAll("[data-font]").forEach(b=>{
    b.onclick=()=>{ S.font=b.dataset.font; layout(180); render(); markDirty(); paintSettings(); };
  });
  document.querySelectorAll("[data-ori]").forEach(b=>{
    b.classList.toggle("on", S.orientation===b.dataset.ori);
    b.onclick=()=>{ S.orientation=b.dataset.ori; markDirty(); paintSettings(); toast("내보낼 때 이 방향으로 나옵니다"); };
  });
  document.querySelectorAll("[data-curve]").forEach(b=>{
    b.classList.toggle("on", (S.curve||"curve")===b.dataset.curve);
    b.onclick=()=>{ S.curve=b.dataset.curve; render(); markDirty(); paintSettings(); };
  });
  document.querySelectorAll("[data-hub]").forEach(b=>{
    b.classList.toggle("on", String(S.hubMin||3)===b.dataset.hub);
    b.onclick=()=>{ S.hubMin=+b.dataset.hub; layout(160); render(); markDirty(); paintSettings(); };
  });
}
$("#btnSettings").onclick = ()=>{ paintSettings(); openModal("#mdSettings"); };
$("#setClose").onclick = ()=>closeModal("#mdSettings");
$("#cfNo").onclick = ()=>closeModal("#mdConfirm");

// 키보드
document.addEventListener("keydown", e=>{
  if(document.querySelector(".modal:not(.hidden)")) {
    if(e.key==="Escape") document.querySelectorAll(".modal").forEach(m=>m.classList.add("hidden")), hideScrim();
    return;
  }
  if($("#appView").classList.contains("hidden")) return;
  if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); askKeyword(sel||"root"); }
  if(e.key==="Escape"){ sel=null; linkMode=false; $("#hintbar").classList.add("hidden"); render(); }
  if((e.key==="Delete"||e.key==="Backspace") && sel && sel!=="root") $("#aDel").click();
});
window.addEventListener("beforeunload", e=>{ if(dirty){ saveNow(); } });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && dirty) saveNow(); });

/* ==========================================================================
   15. 인증
   ========================================================================== */
function authMsg(m){ $("#authMsg").textContent=m||""; }
function cfgHint(){
  if(window.__cfgMissing) return "firebase-config.js 파일이 없습니다. mindmap.html과 같은 폴더에 올려주세요.";
  if(!window.FIREBASE_CONFIG) return "firebase-config.js 안에 window.FIREBASE_CONFIG 가 없습니다.";
  return "firebase-config.js 의 값이 아직 비어 있습니다. 콘솔에서 복사한 값으로 채워주세요.";
}
$("#btnLogin").onclick = async ()=>{
  if(!FB){ authMsg(cfgHint()); return; }
  const em=$("#email").value.trim(), pw=$("#pw").value;
  if(!em||!pw){ authMsg("이메일과 비밀번호를 입력해 주세요."); return; }
  authMsg("");
  try{
    await FB.A.signInWithEmailAndPassword(FB.auth, em, pw);
  }catch(e){ authMsg(authError(e)); }
};
$("#pw").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#btnLogin").click(); });
$("#email").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#pw").focus(); });
$("#btnGuest").onclick = ()=>{
  MODE="local"; USER={uid:"local", email:"이 기기"};
  enterApp();
};
$("#btnLogout").onclick = async ()=>{
  if(MODE==="cloud" && FB){ await FB.A.signOut(FB.auth); }
  USER=null; show("#authView");
};
function authError(e){
  const c=(e&&e.code)||"";
  if(c.includes("invalid-credential")||c.includes("wrong-password")) return "이메일 또는 비밀번호가 맞지 않습니다.";
  if(c.includes("user-not-found")) return "등록되지 않은 이메일입니다.";
  if(c.includes("email-already-in-use")) return "이미 가입된 이메일입니다.";
  if(c.includes("weak-password")) return "비밀번호는 6자 이상이어야 합니다.";
  if(c.includes("invalid-email")) return "이메일 형식을 확인해 주세요.";
  if(c.includes("popup-closed")) return "로그인 창이 닫혔습니다.";
  if(c.includes("operation-not-allowed")) return "Firebase 콘솔에서 해당 로그인 방식을 켜주세요.";
  return "로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.";
}
function enterApp(){
  $("#whoami").textContent = MODE==="cloud"
    ? `${USER.email||"로그인됨"} · 클라우드 저장`
    : "이 기기에만 저장됩니다";
  show("#startView"); refreshRecent();
}

/* ==========================================================================
   16. 시작
   ========================================================================== */
paintIcons();
(async function boot(){
  try{ FB = await initFirebase(); }catch(e){ console.warn("Firebase 초기화 건너뜀", e); }
  if(FB){
    FB.A.onAuthStateChanged(FB.auth, u=>{
      if(u){ USER=u; MODE="cloud"; enterApp(); }
      else { USER=null; show("#authView"); }
    });
  }else{
    show("#authView");
    authMsg(cfgHint());
    $("#btnGuest").classList.remove("hidden");
    $("#btnGuest").classList.add("primary");
  }
})();
</script>
